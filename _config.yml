# Theme Setup
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "aqua" # Built-in skins: "air", "aqua", "contrast", "dark", "dirt", "neon", "plum", "sunrise"

# Site Information
title: "Engineering & Systems Journal"
name: "Lalit"
description: "Technical notes on systems, AI models, and architecture."
url: "https://lalitb22.github.io"
baseurl: ""

# Author Profile (Left Sidebar)
author:
  name: "Lalit"
  bio: "Software Engineer & Systems Builder"
  location: "India"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lalitb22"

# Layout Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
