# Theme Setup
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"

# Site Information
title: "Engineering & Systems Journal"
name: "Lalit"
description: "Technical notes on systems, AI models, and architecture."
url: "https://lalitb22.github.io"
baseurl: ""
repository: "lalitb22/lalitb22.github.io"
markdown: kramdown
highlighter: rouge
include:
  - _pages
exclude:
  - README.md
  - docs
  - scripts
  - vendor


# Author Profile (Left Sidebar)
author:
  name: "Lets Write About IT"
  bio: "Philosophical Engineering thoughts and findings"
  location: "India"
  avatar: "/assets/images/avatar.png"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lalitb22"

# Layout Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
      toc_label: "On this page"

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
